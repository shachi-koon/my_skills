  # ===========================================
  # システム管理者API
  # ===========================================
  /system/tenants:
    get:
      tags: [System]
      summary: テナント一覧
      operationId: listTenants
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, suspended, cancelled]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: perPage
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TenantResponse'
                  pagination:
                    $ref: '#/components/schemas/Pagination'

    post:
      tags: [System]
      summary: テナント登録
      operationId: createTenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreateRequest'
      responses:
        '201':
          description: テナント作成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'

  /system/tenants/{id}:
    get:
      tags: [System]
      summary: テナント詳細
      operationId: getTenant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'

    put:
      tags: [System]
      summary: テナント更新
      operationId: updateTenant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                plan:
                  type: string
                  enum: [starter, professional, enterprise]
                contactEmail:
                  type: string
                  format: email
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'

    delete:
      tags: [System]
      summary: テナント解約（論理削除）
      operationId: cancelTenant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 解約成功

  /system/tenants/{id}/status:
    patch:
      tags: [System]
      summary: テナントステータス変更
      operationId: changeTenantStatus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [active, suspended, cancelled]
      responses:
        '200':
          description: ステータス変更成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'

  /system/tenants/{id}/export:
    post:
      tags: [System]
      summary: データエクスポートジョブ開始
      operationId: startExportJob
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                format:
                  type: string
                  enum: [csv, json]
                  default: csv
                includeAttachments:
                  type: boolean
                  default: false
      responses:
        '202':
          description: ジョブ開始（非同期処理）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJobResponse'

  /system/tenants/{id}/export/{jobId}:
    get:
      tags: [System]
      summary: エクスポートジョブ状況
      operationId: getExportJobStatus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJobResponse'

  /system/monitoring:
    get:
      tags: [System]
      summary: システム監視ダッシュボード
      operationId: getSystemMonitoring
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalTenants:
                    type: integer
                  activeTenants:
                    type: integer
                  totalInquiries:
                    type: integer
                  inquiriesToday:
                    type: integer
                  systemHealth:
                    type: string
                    enum: [healthy, degraded, critical]
                  services:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        status:
                          type: string
                          enum: [up, down, degraded]
                        latencyMs:
                          type: integer
